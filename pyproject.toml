[build-system]
requires = ["hatchling>=1.32.0", "pitloom>=0.16.2"]
build-backend = "hatchling.build"

[project]
name = "licenseid"
dynamic = ["version"]
description = "Get the SPDX License ID from license text"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "Arthit Suriyawongkul", email = "suriyawa@tcd.ie" }]
keywords = [
    "license",
    "matcher",
    "spdx",
    "license-matcher",
    "opensource",
    "licenseid",
    "copyright",
    "license-identifier",
    "spdx-license-id",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Legal Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "beautifulsoup4>=4.15.0",
    "click>=8.4.2",
    "py-spdx-license>=0.0.1",
    "rapidfuzz>=3.14.5",
    "requests>=2.33.0", # sync with `types-requests` version
    "typing_extensions>=4.16.0",
]

[project.optional-dependencies]
java = ["jpype1>=1.7.1"]

[project.scripts]
licenseid = "licenseid.cli:main"

[project.urls]
homepage = "https://pypi.org/project/licenseid/"
source = "https://github.com/bact/licenseid.git"
download = "https://github.com/bact/licenseid/releases"
releasenotes = "https://github.com/bact/licenseid/releases"
documentation = "https://github.com/bact/licenseid#readme"
issues = "https://github.com/bact/licenseid/issues"

[dependency-groups]
lint = [
    "flake8>=7.3.0",
    "flake8-cognitive-complexity>=0.1.0",
    "pylint>=4.0.7",
    "ruff>=0.16.3",
]
test = ["coverage>=7.15.4", "coveralls>=4.1.0", "pytest>=9.1.1"]
typecheck = ["mypy>=1.20.2", "types-requests>=2.33.0.20260518"]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    { include-group = "typecheck" },
]

[tool.coverage.paths]
source = ["src/licenseid", "**/site-packages/licenseid"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "def __repr__",
    "raise NotImplementedError",
]
show_missing = true

[tool.coverage.run]
branch = true
source = ["licenseid"]

[tool.hatch.build.hooks.pitloom]
enabled = true

[tool.hatch.build.targets.sdist]
exclude = ["AGENTS.md", "GEMINI.md", "tests/fixtures/**", "scripts/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/licenseid"]

[tool.hatch.version]
path = "src/licenseid/__init__.py"

[tool.mypy]
exclude = ["tests/fixtures/"]
pretty = true
python_version = "3.10"
mypy_path = ["src"]
show_column_numbers = true
show_error_code_links = true
show_error_context = true
strict = true
strict_equality_for_none = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["jpype", "jpype.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["py_spdx_license", "py_spdx_license.*"]
ignore_missing_imports = true

[tool.pitloom.content-type]
enabled = true

[[tool.pitloom.creator]]
name = "Arthit Suriyawongkul"
email = "suriyawa@tcd.ie"

[tool.pylint.main]
ignore = ["CVS"]
ignore-paths = ["^tests/fixtures/.*$"]
persistent = true

[tool.pylint.messages_control]
disable = [
    "import-outside-toplevel",
    "too-few-public-methods",
    "invalid-name",
    "broad-exception-caught",
]

[tool.pylint.reports]
evaluation = "10.0 - ((float(5 * error + warning + refactor + convention) / statement) * 10)"
output-format = "text"
reports = false

[tool.pylint.basic]
class-rgx = "[A-Z_][a-zA-Z0-9]+$"
function-rgx = "[a-z_][a-z0-9_]{2,30}$"
good-names = ["i", "j", "k", "ex", "Run", "_", "f", "r", "m", "dt", "id", "db"]
method-rgx = "[a-z_][a-z0-9_]{2,30}$"

# Complexity ceilings. "target:" is pylint's own built-in default for that
# option (checked clean, outside this repo's config). Each ceiling below
# is an interim ratchet set to the exact current repo max where that max
# exceeds target — see the "# target:" comment on each line, and
# working-docs/design/complexity-and-file-size-roadmap.md for the backlog
# that has to shrink before a ceiling can drop to target.
[tool.pylint.design]
max-args = 6                 # target: 5
max-attributes = 10
max-bool-expr = 5
max-branches = 15            # target: 12
max-locals = 23              # target: 15
max-nested-blocks = 5        # target: 5
max-parents = 7
max-positional-arguments = 6
max-public-methods = 20
min-public-methods = 1
max-returns = 6              # target: 6
max-statements = 50          # target: 50

[tool.pylint.format]
max-line-length = 88
max-module-lines = 977 # target: 800 (hard limit); soft limit 400-500

[tool.pytest.ini_options]
markers = [
    "benchmark: marks tests as slow benchmark (deselect with '-m \"not benchmark\"')",
]

[tool.ruff]
extend-exclude = ["tests/fixtures/"]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
# BLE001/S110: broad `except Exception` (bare or with a `pass` body) is used
# deliberately here — CLI-boundary error handling and best-effort optional
# integrations (Java/JPype consultation, speculative INI parsing) that must
# degrade gracefully rather than propagate. Same stance as
# `broad-exception-caught` in [tool.pylint.messages_control].
ignore = ["BLE001", "S110"]
