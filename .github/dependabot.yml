# Dependabot version updates. Options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
- package-ecosystem: "github-actions"
  cooldown:
    default-days: 7
  directory: "/"
  schedule:
    interval: "weekly"
  open-pull-requests-limit: 10
- package-ecosystem: "pip"
  cooldown:
    default-days: 7
  directory: "/"
  schedule:
    interval: "weekly"
  open-pull-requests-limit: 10
- package-ecosystem: "pip"
  cooldown:
    default-days: 7
  directory: "/.github"
  schedule:
    interval: "weekly"
  open-pull-requests-limit: 10
