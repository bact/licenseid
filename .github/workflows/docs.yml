name: Docs

# The other workflows skip a change to Markdown alone: this one lints every
# Markdown file and runs the tests that hold the user docs to the code. A
# code change runs the same tests in "Unit tests".
on:
  push:
    branches: [ main, develop ]
    paths:
      - "**.md"
      - ".markdownlint.jsonc"
      - ".markdownlint-cli2.jsonc"
      - ".github/workflows/docs.yml"
      - "tests/docs_*.py"
      - "tests/test_docs_*.py"
  pull_request:
    branches: [ main, develop ]
    paths:
      - "**.md"
      - ".markdownlint.jsonc"
      - ".markdownlint-cli2.jsonc"
      - ".github/workflows/docs.yml"
      - "tests/docs_*.py"
      - "tests/test_docs_*.py"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reads .markdownlint.jsonc (rules) and .markdownlint-cli2.jsonc
      # (ignores), as `markdownlint-cli2 "**/*.md"` does locally.
      - name: markdownlint-cli2
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: "**/*.md"

  doc-tests:
    name: Doc tests
    runs-on: ubuntu-latest
    env:
      # No snapshot: this job builds the package only to install it.
      LICENSEID_BUNDLE: skip

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . --group test

      - name: Run the doc tests
        run: |
          pytest tests/test_docs_vocabulary.py tests/test_docs_status.py \
            tests/test_docs_examples.py tests/test_docs_numbers.py \
            tests/test_lists_page.py tests/test_resolver_shapes.py -n auto -v --tb=short
