name: Unit tests

# A change to notes and docs alone starts no run. The order of "paths"
# matters: a later pattern overrides an earlier one.
on:
  push:
    branches: [ main, develop ]
    paths:
      - "**"
      - "!AGENTS.md"
      - "!CHANGELOG.md"
      - "!CLAUDE.md"
      - "!SECURITY.md"
      - "!README.md"
      - "!docs/**"
      - "!working-docs/**"
      - "docs/resolve.md"
  pull_request:
    branches: [ main, develop ]
    paths:
      - "**"
      - "!AGENTS.md"
      - "!CHANGELOG.md"
      - "!CLAUDE.md"
      - "!SECURITY.md"
      - "!README.md"
      - "!docs/**"
      - "!working-docs/**"
      - "docs/resolve.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        os: [ ubuntu-latest ]
        python-version: [ "3.10", "3.14" ]
        include:
          # 0.4.0 shipped a Windows-only path bug (invalid SQLite URI).
          - os: windows-latest
            python-version: "3.11"
      fail-fast: false
    env:
      MAIN_SUPPORT_VERSION: "3.10"
      # No snapshot: this job builds the package only to install it.
      LICENSEID_BUNDLE: skip

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install . --group test

      # A pull request runs only the files that depend on the operating
      # system on Windows (tests/platform_files.py); a push runs them all, so
      # a gap in that list shows after the merge. Linux always runs all.
      - name: Run tests (w/o code coverage)
        if: ${{ matrix.python-version != env.MAIN_SUPPORT_VERSION && runner.os != 'Windows' }}
        run: |
          pytest tests/ -n auto -v --tb=short

      - name: Run platform tests (Windows, pull request)
        if: ${{ runner.os == 'Windows' && github.event_name == 'pull_request' }}
        run: |
          pytest tests/ -m platform -n auto -v --tb=short

      - name: Run tests (Windows, push)
        if: ${{ runner.os == 'Windows' && github.event_name != 'pull_request' }}
        run: |
          pytest tests/ -n auto -v --tb=short

      - name: Run tests (w/ code coverage)
        if: ${{ matrix.python-version == env.MAIN_SUPPORT_VERSION }}
        env:
          PYTHONPATH: src
        run: |
          coverage run -m pytest tests/ -n auto -v --tb=short
          coverage combine

      - name: Upload coverage reports
        if: ${{ matrix.python-version == env.MAIN_SUPPORT_VERSION }}
        continue-on-error: true
        env:
          COVERALLS_SERVICE_NAME: github
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONIOENCODING: utf-8
        run: coveralls
