name: Publish to PyPI

on:
  release:
    types: [ published ]

permissions: read-all

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sbom-path: ${{ steps.pitloom.outputs.sbom-path }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build dependencies
        run: |
          pip install --upgrade build pip
          pip install -e .
          pip install spdx3-validate

      - name: Build sdist and wheel
        run: |
          python -m build

      - name: Embed SBOM into the wheel
        id: pitloom
        uses: bact/pitloom@4842922f65fb7ed1c5e51507c0fb253c62d97960 # v0.16.2
        with:
          embed-wheel: "dist/*.whl"
          project-path: "."
          extras: "content-type"
          content-type: "true"
          upload-artifact: "true"
          artifact-name: "sbom"

      - name: Check SBOM is at the PEP 770 location
        id: locate-sbom
        env:
          SBOM_PATH: ${{ steps.pitloom.outputs.sbom-path }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "::error::expected exactly one wheel in dist/, found" \
              "${#wheels[@]}: ${wheels[*]}"
            exit 1
          fi
          whl="${wheels[0]}"
          sbom_basename=$(basename "${SBOM_PATH}")

          matched=""
          while IFS= read -r entry; do
            case "${entry}" in
              *.dist-info/sboms/"${sbom_basename}")
                matched="${entry}"
                break
                ;;
            esac
          done < <(unzip -Z1 "${whl}")

          if [ -z "${matched}" ]; then
            echo "::error::${sbom_basename} not found under" \
              "*.dist-info/sboms/ in ${whl}"
            exit 1
          fi
          echo "Found: ${matched}"
          echo "wheel=${whl}" >> "${GITHUB_OUTPUT}"
          echo "entry=${matched}" >> "${GITHUB_OUTPUT}"

      - name: Validate SBOM extracted from the wheel
        env:
          WHEEL: ${{ steps.locate-sbom.outputs.wheel }}
          ENTRY: ${{ steps.locate-sbom.outputs.entry }}
        run: |
          set -euo pipefail
          extracted="$(mktemp -d)/temp-sbom.json"
          unzip -p "${WHEEL}" "${ENTRY}" > "${extracted}"
          spdx3-validate --json "${extracted}"

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 3

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for trusted publishing (OIDC)

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  attach-release-sbom:
    name: Attach SBOM to GitHub Release
    needs: [ build, publish ]
    # A custom "if:" replaces needs:'s implicit success() gate, so all
    # conditions are explicit here:
    # - build.result == 'success': skip if "Validate SBOM" failed in "build".
    # - publish.result == 'success': skip if PyPI publish failed, so the
    #   release never carries an SBOM for a package that wasn't published.
    # - sbom-path != '': skip if "build" produced no standalone SBOM
    #   (embed-wheel matched more than one wheel), since no "sbom"
    #   artifact was uploaded for this job to download.
    if: |
      needs.build.result == 'success' && needs.publish.result == 'success' &&
      needs.build.outputs.sbom-path != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release upload, for the standalone SBOM asset

    steps:
      - name: Download SBOM artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: sbom/

      - name: Attach SBOM to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          SBOM_BASENAME: ${{ needs.build.outputs.sbom-path }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release upload "${RELEASE_TAG}" "sbom/${SBOM_BASENAME}" \
            --clobber --repo "${REPO}"

  attach-release-dist:
    name: Attach distribution to GitHub Release
    needs: [ build, publish ]
    # Only attach once PyPI publish has actually succeeded, so the release
    # page never carries artifacts that weren't published (or were
    # published as something different, if a later step were to fail).
    if: needs.build.result == 'success' && needs.publish.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release upload, for the sdist/wheel assets

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Attach sdist and wheel to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release upload "${RELEASE_TAG}" dist/*.whl dist/*.tar.gz \
            --clobber --repo "${REPO}"

  sign-and-attest:
    name: Sign artifacts and attach provenance
    needs: [ build, publish ]
    runs-on: ubuntu-latest
    permissions:
      contents: write # gh release upload, for signature/attestation assets
      id-token: write # Sigstore keyless signing + attestation signing
      attestations: write # actions/attest-build-provenance

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Sign artifacts with Sigstore
        uses: sigstore/gh-action-sigstore-python@f7ad0af51a5648d09a20d00370f0a91c3bdf8f84 # v3.0.1
        with:
          inputs: dist/*.whl dist/*.tar.gz
          # Default is "true" and, on a release-triggered run, additionally
          # downloads and signs GitHub's auto-generated source zip/tar.gz
          # archives -- unwanted here, and a hard failure (unhandled
          # requests.raise_for_status()) if that download ever 404s/429s.
          release-signing-artifacts: "false"

      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: "dist/*.whl, dist/*.tar.gz"

      - name: Attach signatures and provenance to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release upload "${RELEASE_TAG}" dist/*.sigstore.json \
            --clobber --repo "${REPO}"
