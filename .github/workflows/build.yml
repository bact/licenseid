name: Build wheels

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-wheel:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        os: [ ubuntu-latest ]
        python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]
        #include:
        #  - os: windows-latest
        #    python-version: "3.10"
        #  - os: macos-latest
        #    python-version: "3.10"
      fail-fast: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build dependencies
        run: |
          pip install --upgrade build pip
          pip install .

      - name: Build wheel
        id: build
        run: |
          python -m build

      # The same check the release runs (pypi-publish.yml), so a missing or
      # invalid SBOM shows on a pull request, not first at release time.
      - name: Check the SBOM embedded in the wheel
        run: |
          pip install spdx3-validate
          .github/scripts/check-wheel-sbom.sh dist "${RUNNER_TEMP}/sbom"
