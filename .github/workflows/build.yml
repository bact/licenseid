name: Build wheels

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-wheel:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      # The pins of the release, so a pull request builds as a release does.
      PIP_CONSTRAINT: ${{ github.workspace }}/.github/requirements-release.txt
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        os: [ ubuntu-latest ]
        python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]
        #include:
        #  - os: windows-latest
        #    python-version: "3.10"
        #  - os: macos-latest
        #    python-version: "3.10"
      fail-fast: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install build dependencies
        run: |
          pip install --upgrade build pip
          pip install .

      - name: Build wheel
        id: build
        run: |
          python -m build

      # The same checks the release runs (pypi-publish.yml), so a missing or
      # invalid SBOM shows on a pull request, not first at release time.
      # Once, not per Python: the SBOM does not depend on the interpreter.
      - name: Check the SBOM embedded in the wheel
        if: matrix.python-version == '3.14'
        run: |
          set -euo pipefail
          pip install "pitloom[content-type]" spdx3-validate
          python scripts/extract_wheel_sbom.py dist "${RUNNER_TEMP}/sbom" \
            --require-magika --github-output "${RUNNER_TEMP}/sbom.out"
          wheel=$(sed -n 's/^wheel-path=//p' "${RUNNER_TEMP}/sbom.out")
          sbom=$(sed -n 's/^sbom-path=//p' "${RUNNER_TEMP}/sbom.out")
          name=$(sed -n 's/^sbom-name=//p' "${RUNNER_TEMP}/sbom.out")
          loom verify-wheel --fail-on-mismatch "${wheel}" --sbom-filename "${name}"
          python scripts/check_sbom_license.py --license Apache-2.0 \
            "${wheel}" "${sbom}"
          loom validate-wheel "${wheel}" --sbom-filename "${name}"
          spdx3-validate --json "${sbom}"
