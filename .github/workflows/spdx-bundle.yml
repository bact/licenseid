# Publishes the SPDX License List bundle that `licenseid update` fetches from
# raw.githubusercontent.com: `spdx/format-1/v<version>.json.gz` and
# `spdx/format-1/latest.json` on the orphan `data` branch.
#
# One-time set-up, by hand: create the orphan `data` branch and protect it
# from force-push and deletion. A scheduled workflow stops after 60 days
# without repository activity; run it by hand to wake it.

name: Publish SPDX bundle

on:
  schedule:
    - cron: "19 22 * * 2"
  workflow_dispatch:
    inputs:
      version:
        description: "SPDX license list release, e.g. 3.29.0 (default: latest)"
        required: false
        type: string

# One publisher at a time, so two pushes to `data` never race.
concurrency:
  group: spdx-bundle
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    name: Build and publish the bundle
    if: github.repository == 'bact/licenseid'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: data
          path: data
          persist-credentials: false

      # The release comes from the input or SPDX's latest release; the
      # decision reads the `data` checkout, never the raw URL (cached 5 min).
      - name: Pick the release
        id: want
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION#v}"
          if [[ -z "${version}" ]]; then
            tag=$(gh api repos/spdx/license-list-data/releases/latest \
              --jq .tag_name)
            version="${tag#v}"
          fi
          if [[ ! "${version}" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error::invalid release: ${version}"
            exit 1
          fi
          if [[ -f "data/spdx/format-1/v${version}.json.gz" ]]; then
            echo "v${version} is already published"
            echo "build=false" >> "${GITHUB_OUTPUT}"
          else
            echo "build=true" >> "${GITHUB_OUTPUT}"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Set up Python
        if: steps.want.outputs.build == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml

      # The runtime dependencies, read from pyproject.toml: the tool imports
      # the package, which needs them, but not a built wheel.
      - name: Build the bundle
        if: steps.want.outputs.build == 'true'
        env:
          VERSION: ${{ steps.want.outputs.version }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -c 'import tomllib; print(*tomllib.load(open("pyproject.toml", "rb"))["project"]["dependencies"], sep="\n")' \
            > "${RUNNER_TEMP}/requirements.txt"
          python -m pip install -r "${RUNNER_TEMP}/requirements.txt"
          PYTHONPATH=src python -m tools.build_bundle --version "${VERSION}" \
            --out data/spdx/format-1

      # The token reaches git only here, for the push, and never the build.
      - name: Publish to the data branch
        if: steps.want.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.want.outputs.version }}
        working-directory: data
        run: |
          set -euo pipefail
          git add spdx
          if git diff --cached --quiet; then
            echo "nothing to publish"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add SPDX License List v${VERSION}"
          auth=$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 | tr -d '\n')
          echo "::add-mask::${auth}"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            push origin HEAD:refs/heads/data
